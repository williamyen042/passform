<!doctype html>
<meta charset="utf-8">
<title>passform · mark contact</title>
<style>
  :root { --bg:#0e1013; --panel:#161a20; --line:#262c35; --text:#e6e9ee;
          --dim:#8b95a3; --key:#7fc8ff; --good:#5ad48a; --hot:#ff5a5a }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.5
         ui-monospace, SFMono-Regular, Menlo, monospace;
         display:flex; flex-direction:column; height:100vh; padding:14px; gap:10px }
  header { display:flex; gap:18px; align-items:baseline; flex-wrap:wrap }
  .big { font-size:22px; letter-spacing:.03em }
  .dim { color:var(--dim) }
  video { flex:1; min-height:0; width:100%; background:#000; border-radius:6px }
  .box { border:1px solid var(--line); background:var(--panel);
         border-radius:6px; padding:10px 12px }
  kbd { background:#222933; border:1px solid var(--line); border-bottom-width:2px;
        border-radius:4px; padding:0 5px; color:var(--key) }
  #bar { height:6px; background:#222933; border-radius:3px; overflow:hidden }
  #bar > i { display:block; height:100%; background:var(--good); width:0 }
  .mark { color:var(--good) }
</style>

<header>
  <span class="big" id="progress">—</span>
  <span class="dim" id="clip"></span>
  <span class="big" id="clock">0.00s</span>
  <span class="dim">of <b id="len">—</b></span>
  <span class="dim">speed <b id="rate">1.00x</b></span>
</header>
<div id="bar"><i></i></div>
<video id="player" autoplay loop muted playsinline></video>
<div class="box" id="hint">
  <b>Scrub to the frame where the ball is on the platform, then press
  <kbd>C</kbd>.</b>
  <span class="dim">One frame later the ball is already leaving.</span><br>
  <span class="dim">
    <kbd>space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> one frame
    (<kbd>shift</kbd> 0.25s) · <kbd>[</kbd><kbd>]</kbd> speed ·
    <kbd>C</kbd> mark contact · <kbd>X</kbd> skip this clip ·
    <kbd>U</kbd> back one clip
  </span>
</div>
<div class="box" id="status"></div>

<script>
const $ = id => document.getElementById(id);
const player = $('player');
const RATES = [0.1, 0.25, 0.5, 1, 1.5];
const params = new URLSearchParams(location.search);
const WANT = +(params.get('n') || 20);
const FRAME = 1 / 60;
let queue = [], at = 0, done = 0, marks = [];

const fmt = t => isFinite(t) ? t.toFixed(2) + 's' : '—';

// Spread the sample over quality and source rather than taking the first 20:
// 20 reps that are all threes from one video would validate the detector on
// the easy case only.
function sample(reps, want) {
  const buckets = {};
  reps.forEach(r => (buckets[`${r.source_video}|${r.quality}`] ||= []).push(r));
  const keys = Object.keys(buckets).sort();
  const out = [];
  while (out.length < want && keys.some(k => buckets[k].length)) {
    for (const k of keys) {
      if (out.length >= want) break;
      if (buckets[k].length) out.push(buckets[k].shift());
    }
  }
  return out;
}

async function boot() {
  const state = await (await fetch('/api/state')).json();
  const unmarked = state.reps.filter(r => r.contact_time == null);
  queue = sample(unmarked, WANT);
  marks = state.reps.filter(r => r.contact_time != null).length;
  if (!queue.length) {
    $('status').innerHTML = `<b class="mark">Nothing left to mark.</b>
      ${marks} reps already have a contact frame.`;
    $('hint').style.display = 'none';
    return;
  }
  show();
}

function show() {
  const rep = queue[at];
  $('progress').textContent = `${at + 1} / ${queue.length}`;
  $('clip').textContent = `${rep.filename} · ${rep.source_video} · quality ${rep.quality} · zone ${rep.position}`;
  $('len').textContent = fmt(rep.duration);
  player.src = '/clip?name=' + encodeURIComponent(rep.filename);
  player.playbackRate = 1;
  $('bar').firstElementChild.style.width = (done / queue.length * 100) + '%';
  tick();
}

function tick() {
  $('clock').textContent = fmt(player.currentTime);
  $('rate').textContent = player.playbackRate.toFixed(2) + 'x';
  requestAnimationFrame(tick);
}

async function mark(contact) {
  const rep = queue[at];
  try {
    const res = await fetch('/api/reps/' + rep.rep_id, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contact_time: contact }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    done++; marks++;
    $('status').innerHTML = `<span class="mark">✓ ${rep.filename} contact at
      ${contact.toFixed(2)}s</span> <span class="dim">(${contact / rep.duration * 100 | 0}%
      into the clip) · ${marks} reps now have a contact frame</span>`;
  } catch (e) {
    $('status').innerHTML = `<span style="color:var(--hot)">not saved: ${e.message}</span>`;
    return;
  }
  next();
}

function next() {
  if (at + 1 >= queue.length) {
    $('status').innerHTML += `<br><b class="mark">Done — all ${queue.length} clips
      seen. Close the tab.</b>`;
    return;
  }
  at++; show();
}

document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ') { e.preventDefault(); player.paused ? player.play() : player.pause(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); player.pause(); player.currentTime -= e.shiftKey ? 0.25 : FRAME; }
  else if (k === 'ArrowRight') { e.preventDefault(); player.pause(); player.currentTime += e.shiftKey ? 0.25 : FRAME; }
  else if (k === 'c' || k === 'C') mark(player.currentTime);
  else if (k === 'x' || k === 'X') { $('status').textContent = `skipped ${queue[at].filename}`; next(); }
  else if (k === 'u' || k === 'U') { if (at > 0) { at--; show(); } }
  else if (k === '[' || k === ']') {
    const i = RATES.indexOf(player.playbackRate);
    player.playbackRate = RATES[Math.min(RATES.length - 1,
      Math.max(0, (i < 0 ? 3 : i) + (k === ']' ? 1 : -1)))];
  }
});
boot();
</script>
