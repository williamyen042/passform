<!doctype html>
<meta charset="utf-8">
<title>passform · annotate</title>
<style>
  :root {
    --bg:#0e1013; --panel:#161a20; --line:#262c35; --text:#e6e9ee;
    --dim:#8b95a3; --hot:#ff5a5a; --good:#5ad48a; --warn:#ffc14d; --key:#7fc8ff;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45
         ui-monospace, SFMono-Regular, Menlo, monospace; }
  #app { display:grid; grid-template-columns:minmax(0,1fr) 340px; height:100vh }
  #stage { display:flex; flex-direction:column; min-width:0; padding:12px; gap:10px }
  aside { border-left:1px solid var(--line); background:var(--panel);
          overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:14px }
  video#player { width:100%; min-height:0; flex:1; background:#000; border-radius:6px }
  header { display:flex; gap:14px; align-items:center; flex-wrap:wrap }
  select, input, button { font:inherit; background:#1d232b; color:var(--text);
          border:1px solid var(--line); border-radius:4px; padding:3px 6px }
  button { cursor:pointer } button:hover { border-color:var(--key) }
  .dim { color:var(--dim) }
  .box { border:1px solid var(--line); border-radius:6px; padding:10px }
  #banner { font-size:15px; min-height:64px; display:flex; align-items:center;
            justify-content:space-between; gap:16px }
  #banner.rec { border-color:var(--hot); box-shadow:inset 0 0 0 1px var(--hot) }
  #banner.pos { border-color:var(--key); box-shadow:inset 0 0 0 1px var(--key) }
  #banner.ok  { border-color:var(--good) }
  .big { font-size:22px; letter-spacing:.04em }
  .rec-dot { color:var(--hot) }
  h2 { font-size:11px; letter-spacing:.14em; text-transform:uppercase;
       color:var(--dim); margin:0 0 6px; font-weight:600 }
  kbd { background:#222933; border:1px solid var(--line); border-bottom-width:2px;
        border-radius:4px; padding:0 5px; color:var(--key) }
  table { width:100%; border-collapse:collapse }
  td { padding:2px 4px; vertical-align:top }
  td.k { width:22px; color:var(--key) }
  .muted td { color:var(--dim) }
  .bar { height:4px; background:#222933; border-radius:2px; overflow:hidden }
  .bar > i { display:block; height:100%; background:var(--key) }
  .warn { color:var(--warn) }
  #reps { display:flex; flex-direction:column; gap:2px; font-size:12px }
  #reps .row { display:flex; gap:8px; padding:3px 5px; border-radius:4px; cursor:pointer }
  #reps .row:hover { background:#1d232b }
  #reps .row.sel { background:#1d232b; outline:1px solid var(--key) }
  #edit { display:grid; grid-template-columns:auto 1fr; gap:5px 8px; align-items:center;
          margin-top:6px; padding:8px; background:#11151a; border-radius:5px }
  #edit .wide { grid-column:1/3; display:flex; gap:6px; flex-wrap:wrap }
  #toast { position:fixed; bottom:14px; left:14px; padding:8px 12px; border-radius:5px;
           background:var(--hot); color:#fff; display:none; max-width:60vw }
</style>

<div id="app">
  <section id="stage">
    <header>
      <select id="source"></select>
      <span id="clock" class="big">00:00:00.00</span>
      <span class="dim" id="duration">/ --:--:--.--</span>
      <span class="dim">speed <b id="rate">1.00x</b></span>
      <span class="dim" id="dataset"></span>
    </header>
    <video id="player" controls preload="metadata"></video>
    <div id="banner" class="box"></div>
    <div class="dim" style="font-size:12px">
      <kbd>space</kbd> play <kbd>S</kbd> start rep <kbd>0</kbd>–<kbd>3</kbd> quality
      <kbd>1</kbd>–<kbd>6</kbd>/<kbd>F1</kbd>–<kbd>F6</kbd> position
      <kbd>↵</kbd> repeat last position <kbd>X</kbd>/<kbd>R</kbd> discard
      <kbd>⌫</kbd> undo last save
      <kbd>←</kbd><kbd>→</kbd> seek (<kbd>shift</kbd> fine) <kbd>,</kbd><kbd>.</kbd> frame
      <kbd>[</kbd><kbd>]</kbd> speed
    </div>
  </section>

  <aside>
    <div class="box">
      <h2>Quality</h2>
      <table id="quality-legend"></table>
    </div>
    <div class="box">
      <h2>Position <span class="dim">(passer's zone)</span></h2>
      <table id="position-legend"></table>
    </div>
    <div class="box">
      <h2>Dataset</h2>
      <div id="summary"></div>
    </div>
    <div class="box">
      <h2>Saved reps <span class="dim">(click to correct)</span></h2>
      <div id="reps"></div>
    </div>
  </aside>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const player = $('player');
const RATES = [0.25, 0.5, 0.75, 1, 1.5, 2];
const PRIMARY = [1, 5, 6];            // back row: what you are usually labelling
let state = { reps: [], quality: {}, position: {}, sources: [], selected: null };
let phase = 'idle';                   // idle | recording | position
let rep = { start: null, end: null, quality: null };
let lastPosition = 6;                 // sticky: Enter repeats it
let saved = null, selectedRep = null;

const fmt = t => {
  if (!isFinite(t)) return '--:--:--.--';
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:` +
         `${s.toFixed(2).padStart(5,'0')}`;
};
const toast = (msg, ok) => {
  const el = $('toast');
  el.textContent = msg;
  el.style.background = ok ? 'var(--good)' : 'var(--hot)';
  el.style.color = ok ? '#06240f' : '#fff';
  el.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.style.display = 'none', 4000);
};

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  } : undefined);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function boot() {
  state = await api('/api/state');
  $('dataset').textContent = state.dataset;
  if (!state.ffmpeg) toast('ffmpeg not found — saving a rep will fail. brew install ffmpeg');
  $('source').innerHTML = state.sources
    .map(s => `<option${s === state.selected ? ' selected' : ''}>${s}</option>`).join('')
    || '<option value="">no videos found</option>';
  legends();
  load($('source').value);
  render();
}

function legends() {
  $('quality-legend').innerHTML = [3, 2, 1, 0].map(q => {
    const [name, why] = state.quality[q].split(' - ');
    return `<tr><td class="k">${q}</td><td><b>${name}</b><br>
            <span class="dim">${why}</span></td></tr>`;
  }).join('');
  $('position-legend').innerHTML = [1, 5, 6, 2, 3, 4].map(p =>
    `<tr class="${PRIMARY.includes(p) ? '' : 'muted'}"><td class="k">${p}</td>
     <td>${state.position[p]}</td></tr>`).join('');
}

function load(src) {
  if (!src) return;
  state.selected = src;
  player.src = '/media?path=' + encodeURIComponent(src);
  reset();
}

function reset() {
  phase = 'idle';
  rep = { start: null, end: null, quality: null };
  render();
}

function render() {
  $('clock').textContent = fmt(player.currentTime);
  $('duration').textContent = '/ ' + fmt(player.duration);
  $('rate').textContent = player.playbackRate.toFixed(2) + 'x';

  const banner = $('banner');
  banner.className = 'box ' + (phase === 'recording' ? 'rec' : phase === 'position' ? 'pos' : saved ? 'ok' : '');
  if (phase === 'recording') {
    banner.innerHTML = `<div><span class="rec-dot">●</span> <b class="big">RECORDING REP</b>
      <span class="dim">— press 0–3 when the pass is complete, x to discard</span><br>
      Start: <b>${fmt(rep.start)}</b>
      <span class="dim">elapsed ${(player.currentTime - rep.start).toFixed(2)}s</span></div>`;
  } else if (phase === 'position') {
    const [name] = state.quality[rep.quality].split(' - ');
    banner.innerHTML = `<div><b class="big">Quality: ${rep.quality} — ${name}</b>
      <span class="dim">${fmt(rep.start)} → ${fmt(rep.end)}
      (${(rep.end - rep.start).toFixed(2)}s)</span><br>
      Passing position: ${PRIMARY.map(p => `<kbd>${p}</kbd> ${state.position[p]}`).join('  ')}
      <span class="dim">· ↵ = ${lastPosition} ${state.position[lastPosition]}</span></div>`;
  } else if (saved) {
    const [name] = state.quality[saved.quality].split(' - ');
    banner.innerHTML = `<div><b class="big" style="color:var(--good)">✓ REP ${
      String(saved.rep_id).padStart(4,'0')} SAVED</b><br>
      Quality: ${saved.quality} — ${name} ·
      Position: ${saved.position} — ${state.position[saved.position]} ·
      Duration: ${saved.duration.toFixed(2)} sec
      <span class="dim">· ${saved.filename}</span></div>
      <div class="dim">press <kbd>S</kbd> for the next rep</div>`;
  } else {
    banner.innerHTML = `<div class="dim">Press <kbd>S</kbd> when the rep starts.</div>`;
  }
  summary();
  repList();
}

function counts(key, keys) {
  const out = {};
  keys.forEach(k => out[k] = 0);
  state.reps.forEach(r => out[r[key]] = (out[r[key]] || 0) + 1);
  return out;
}

function summary() {
  const q = counts('quality', [3, 2, 1, 0]), p = counts('position', [1, 5, 6, 2, 3, 4]);
  const total = state.reps.length;
  const rows = (obj, labels, keys) => keys.map(k => {
    const n = obj[k] || 0, pct = total ? n / total * 100 : 0;
    return `<tr><td class="k">${k}</td><td>${labels[k].split(' - ')[0]}</td>
      <td style="text-align:right">${n}</td>
      <td style="width:60px"><div class="bar"><i style="width:${pct}%"></i></div></td></tr>`;
  }).join('');

  const qs = [3, 2, 1, 0].map(k => q[k] || 0);
  const lo = Math.min(...qs), hi = Math.max(...qs);
  const thin = total >= 30 && (lo === 0 || hi / lo >= 4);
  $('summary').innerHTML = `<div class="big">TOTAL REPS: ${total}</div>
    <table>${rows(q, state.quality, [3, 2, 1, 0])}</table>
    <div style="height:8px"></div>
    <table>${rows(p, state.position, [1, 5, 6, 2, 3, 4])}</table>` +
    (thin ? `<div class="warn" style="margin-top:8px">⚠ quality classes are
      imbalanced (${qs.join(' / ')}). Go looking for the thin ones, or plan to
      weight the loss.</div>` : '');
}

function repList() {
  const sig = JSON.stringify([selectedRep, state.reps.map(r =>
    [r.rep_id, r.quality, r.position, r.start_time, r.end_time, r.notes])]);
  if (sig === repList.sig) return;           // do not stomp the open edit form
  repList.sig = sig;
  const recent = [...state.reps].sort((a, b) => b.rep_id - a.rep_id).slice(0, 40);
  $('reps').innerHTML = recent.map(r => `
    <div class="row ${selectedRep === r.rep_id ? 'sel' : ''}" data-id="${r.rep_id}">
      <span class="dim">${String(r.rep_id).padStart(4,'0')}</span>
      <span style="width:14px">${r.quality}</span>
      <span style="width:14px" class="dim">z${r.position}</span>
      <span class="dim">${fmt(r.start_time)}</span>
      <span class="dim">${r.duration.toFixed(1)}s</span>
    </div>` + (selectedRep === r.rep_id ? editor(r) : '')).join('');
  $('reps').querySelectorAll('.row').forEach(row => row.onclick = () => {
    const id = +row.dataset.id;
    selectedRep = selectedRep === id ? null : id;
    render();
  });
}

function editor(r) {
  return `<div id="edit" onclick="event.stopPropagation()">
    <label>quality</label><select data-f="quality">${[3,2,1,0].map(q =>
      `<option ${q === r.quality ? 'selected' : ''}>${q}</option>`).join('')}</select>
    <label>position</label><select data-f="position">${[1,2,3,4,5,6].map(p =>
      `<option ${p === r.position ? 'selected' : ''}>${p}</option>`).join('')}</select>
    <label>start</label><input data-f="start_time" type="number" step="0.01" value="${r.start_time}">
    <label>end</label><input data-f="end_time" type="number" step="0.01" value="${r.end_time}">
    <label>notes</label><input data-f="notes" value="${r.notes || ''}">
    <div class="wide">
      <button onclick="applyEdit(${r.rep_id})">save / re-cut</button>
      <button onclick="removeRep(${r.rep_id})">delete</button>
      <button onclick="preview(${r.rep_id})">preview clip</button>
    </div>
    <video class="wide" id="preview-${r.rep_id}" controls style="display:none;width:100%"></video>
  </div>`;
}

async function applyEdit(id) {
  const body = {};
  document.querySelectorAll('#edit [data-f]').forEach(el => body[el.dataset.f] =
    el.type === 'number' ? parseFloat(el.value) : el.value);
  body.quality = +body.quality; body.position = +body.position;
  try {
    const { rep: updated } = await api('/api/reps/' + id, body);
    state.reps = state.reps.map(r => r.rep_id === id ? updated : r);
    toast(`rep ${id} updated`, true);
    render();
  } catch (e) { toast(e.message); }
}

async function removeRep(id) {
  try {
    await api('/api/reps/' + id, { deleted: true });
    state.reps = state.reps.filter(r => r.rep_id !== id);
    if (saved && saved.rep_id === id) saved = null;
    selectedRep = null;
    toast(`rep ${id} withdrawn (kept in metadata.json)`, true);
    render();
  } catch (e) { toast(e.message); }
}

function preview(id) {
  const item = state.reps.find(r => r.rep_id === id);
  const el = $('preview-' + id);
  el.src = '/clip?name=' + encodeURIComponent(item.filename);
  el.style.display = 'block';
}

async function save(position) {
  const body = {
    source: state.selected, start_time: rep.start, end_time: rep.end,
    quality: rep.quality, position,
  };
  phase = 'idle';
  lastPosition = position;
  try {
    const { rep: created } = await api('/api/reps', body);
    state.reps.push(created);
    saved = created;
  } catch (e) {
    toast('not saved: ' + e.message);
  }
  player.play();                       // keep rolling into the next rep
  render();
}

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  const k = e.key;

  if (k === ' ') { e.preventDefault(); player.paused ? player.play() : player.pause(); }
  else if (k === 's' || k === 'S') {
    e.preventDefault(); saved = null;
    rep = { start: player.currentTime, end: null, quality: null };
    phase = 'recording';
  }
  else if (phase === 'recording' && '0123'.includes(k)) {
    const end = player.currentTime;
    if (end - rep.start < 0.2) { toast('rep too short — press S again'); return reset(); }
    rep.end = end; rep.quality = +k; phase = 'position';
  }
  else if (phase === 'position' && '123456'.includes(k)) save(+k);
  else if (phase === 'position' && (k === 'Enter' || k === 'p')) save(lastPosition);
  else if (/^F[1-6]$/.test(k)) {
    e.preventDefault();
    const p = +k[1];
    if (phase === 'position') save(p); else { lastPosition = p; toast('position → ' + p, true); }
  }
  else if ('rRxX'.includes(k) || k === 'Escape') {
    // x is discard, same as r. Nothing to record: a rep you never save was
    // never in the dataset, unlike label_reps.py where reps arrive proposed
    // and an exclusion is a count worth keeping.
    if (phase !== 'idle') toast('rep discarded', true);
    reset();
  }
  else if (k === 'Backspace') {
    e.preventDefault();
    const last = state.reps[state.reps.length - 1];
    if (last) removeRep(last.rep_id); else toast('nothing to undo');
  }
  else if (k === 'ArrowLeft') { e.preventDefault(); player.currentTime -= e.shiftKey ? 0.25 : 2; }
  else if (k === 'ArrowRight') { e.preventDefault(); player.currentTime += e.shiftKey ? 0.25 : 2; }
  else if (k === ',') player.currentTime -= 1 / 30;
  else if (k === '.') player.currentTime += 1 / 30;
  else if (k === '[' || k === ']') {
    const i = RATES.indexOf(player.playbackRate);
    player.playbackRate = RATES[Math.min(RATES.length - 1,
      Math.max(0, (i < 0 ? 3 : i) + (k === ']' ? 1 : -1)))];
  }
  else return;
  render();
});

(function tick() {
  $('clock').textContent = fmt(player.currentTime);
  requestAnimationFrame(tick);
})();
player.addEventListener('timeupdate', render);
player.addEventListener('loadedmetadata', render);
$('source').addEventListener('change', e => {
  e.target.blur();                   // otherwise every key goes to the dropdown
  load(e.target.value);
});
boot();
</script>
